@if (showNavigation()) {
	<div class="carousel-arrows">
		<button class="button-arrow arrow-prev" (click)="(null)">
			<svg icon="arrow-tailless" class="svg16"></svg>
		</button>
		<button class="button-arrow arrow-next" (click)="(null)">
			<svg icon="arrow-tailless" class="svg16"></svg>
		</button>
	</div>
}
