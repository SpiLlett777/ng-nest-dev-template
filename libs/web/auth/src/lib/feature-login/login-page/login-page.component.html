<form class="login-form" [formGroup]="loginForm" (ngSubmit)="login()">
	<h1 class="login-header">С возвращением!</h1>

	<div class="login-body">
		<sl-labeled-form-field-wrapper label="Адрес электронной почты">
			<sl-form-input
				placeholder="Введите адрес электронной почты"
				formControlName="email"
			>
				<div class="control-error-block" errorBlock>
					<span class="control-error-text">{{
						loginForm.controls.email.getError(authConfig.email.errorName)
							?.message
					}}</span>
				</div>
			</sl-form-input>
		</sl-labeled-form-field-wrapper>

		<sl-labeled-form-field-wrapper label="Пароль">
			<sl-form-input
				placeholder="Введите пароль"
				type="password"
				[showPasswordToggle]="true"
				formControlName="password"
			></sl-form-input>
		</sl-labeled-form-field-wrapper>

		<sl-labeled-checkbox
			label="Выполнять вход автоматически"
		></sl-labeled-checkbox>

		<button class="button">Войти</button>
	</div>

	<p class="login-link">
		Ещё нет аккаунта?&nbsp;<a
			[routerLink]="['/register']"
			queryParamsHandling="preserve"
			>Зарегистрироваться</a
		>
	</p>
</form>
